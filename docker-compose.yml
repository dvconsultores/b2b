# Server: copy to /opt/b2b next to b2b.sqlite3 and .env, then see docs/deployment.md.
#
#   docker compose pull
#   CONFIRM_CAMPAIGN=primer-contacto-2026 docker compose up -d      # starts one batch
#   docker compose logs -f                                          # follow progress
#
# Never put CONFIRM_CAMPAIGN in .env: it must be given for each launch.
services:
  b2b-outreach:
    image: ${DOCKER_USERNAME:-andresdom2004}/b2b-outreach:latest
    container_name: b2b-outreach
    # One batch per launch: never restart automatically.
    restart: "no"
    environment:
      CONFIRM_CAMPAIGN: ${CONFIRM_CAMPAIGN:-}
      FORCE_NO_DMARC: ${FORCE_NO_DMARC:-0}
      TZ: America/Caracas
    volumes:
      - /opt/b2b:/app/data
    labels:
      # A Watchtower update would stop the batch mid-way; update by hand between batches.
      com.centurylinklabs.watchtower.enable: "false"
    stop_grace_period: 30s
